<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF671F"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C68"/>
      <stop offset="100%" stop-color="#062744"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#046A38"/>
      <stop offset="100%" stop-color="#024b27"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Ring -->
  <circle cx="200" cy="200" r="190" fill="url(#navyGrad)" filter="url(#shadow)" stroke="#FF671F" stroke-width="5"/>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="200" r="142" fill="#FFFFFF" stroke="#0B3C68" stroke-width="4"/>

  <!-- Tricolor Decorative Ring -->
  <path d="M 58 200 A 142 142 0 0 1 342 200" fill="none" stroke="#FF671F" stroke-width="8"/>
  <path d="M 58 200 A 142 142 0 0 0 342 200" fill="none" stroke="#046A38" stroke-width="8"/>

  <!-- Top Curved Text Path -->
  <path id="topTextPath" d="M 45 200 A 155 155 0 0 1 355 200" fill="none"/>
  <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="3.5">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      STANDARDS SAATHI • मानक साथी
    </textPath>
  </text>

  <!-- Bottom Curved Text Path -->
  <path id="bottomTextPath" d="M 355 200 A 155 155 0 0 1 45 200" fill="none"/>
  <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFD54F" letter-spacing="2.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      ★ GOVERNMENT OF INDIA • BIS AI ★
    </textPath>
  </text>

  <!-- Central Emblem Elements -->
  <!-- 24-Spoke Ashoka Chakra Ring -->
  <circle cx="200" cy="200" r="95" fill="#F4F8FC" stroke="#0B3C68" stroke-width="3"/>
  
  <!-- 24 Spokes -->
  <g stroke="#0B3C68" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="108" x2="200" y2="292"/>
    <line x1="108" y1="200" x2="292" y2="200"/>
    <line x1="135" y1="135" x2="265" y2="265"/>
    <line x1="135" y1="265" x2="265" y2="135"/>
    <line x1="117" y1="165" x2="283" y2="235"/>
    <line x1="117" y1="235" x2="283" y2="165"/>
    <line x1="165" y1="117" x2="235" y2="283"/>
    <line x1="235" y1="117" x2="165" y2="283"/>
    <line x1="126" y1="148" x2="274" y2="252"/>
    <line x1="148" y1="126" x2="252" y2="274"/>
    <line x1="148" y1="274" x2="252" y2="126"/>
    <line x1="126" y1="252" x2="274" y2="148"/>
  </g>
  <circle cx="200" cy="200" r="28" fill="#FFFFFF" stroke="#0B3C68" stroke-width="3"/>

  <!-- Stylized ISI & Standards Icon -->
  <!-- Certified Check Shield / ISI Mark Monogram -->
  <path d="M 200 135 L 245 155 L 245 205 C 245 235 200 258 200 258 C 200 258 155 235 155 205 L 155 155 Z" fill="url(#navyGrad)" stroke="#FF671F" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Saffron Inner Check & Diamond -->
  <path d="M 180 195 L 194 210 L 222 175" fill="none" stroke="#FF671F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tiny Central Star / Diamond -->
  <circle cx="200" cy="200" r="5" fill="#FFD54F"/>

  <!-- ISI Letters Inside Shield -->
  <text x="200" y="235" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ISI • IS
  </text>
</svg>
