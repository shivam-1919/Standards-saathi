<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00152a"/>
      <stop offset="100%" stop-color="#0f2b46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Badge with rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Decorative Ring (Saffron & Green Indian Tricolor Accents) -->
  <path d="M 28 32 A 48 48 0 0 1 100 32" fill="none" stroke="#ff7722" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 28 96 A 48 48 0 0 0 100 96" fill="none" stroke="#138808" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Center White Emblem Shield -->
  <circle cx="64" cy="64" r="33" fill="#ffffff" stroke="#e3efff" stroke-width="2"/>
  
  <!-- Navy Inner Ring -->
  <circle cx="64" cy="64" r="28" fill="#001d33"/>

  <!-- Stylized Bureau / ISI Gear & Standard Hallmark -->
  <!-- Central Chakra Rays -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="64" cy="64" r="16" fill="#0a3966"/>

  <!-- Bold BIS / ISI Stylized Icon In Center -->
  <!-- Standard Gauge / Caliper Icon in Gold -->
  <path d="M 52 56 L 64 44 L 76 56" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="4.5" fill="#ffffff"/>
  <path d="M 64 68 L 64 78" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M 56 78 L 72 78" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Mini Green Verified Tick Floating on Top Right -->
  <circle cx="98" cy="30" r="13" fill="#008738" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M 92 30 L 96 34 L 104 26" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
