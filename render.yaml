services:
  - type: web
    name: standards-saathi
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt --no-cache-dir
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISABLE_HEAVY_EMBEDDINGS
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_INFERENCE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        value: admin123
